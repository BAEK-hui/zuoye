<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻敲 · 打字练习</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6f5;color:#243b35;font-family:system-ui,"Microsoft YaHei",sans-serif;padding:24px}main{width:min(820px,100%)}header{margin-bottom:28px}h1{font-size:32px;letter-spacing:2px;margin:0 0 10px}p{color:#71837d;line-height:1.7}.tag{font-size:12px;color:#258568;letter-spacing:3px;margin-bottom:12px}.card{background:white;border:1px solid #e0e8e4;border-radius:20px;padding:30px;box-shadow:0 14px 45px #203e3106}.label{font-size:12px;color:#83948c;letter-spacing:2px;margin-bottom:16px}#reference{font-size:21px;line-height:2;overflow-wrap:anywhere;white-space:pre-wrap}.correct{color:#14835a;background:#eaf8ef}.wrong{color:#d54646;background:#ffeded;text-decoration:underline}.current{border-bottom:2px solid #378e72}textarea{width:100%;min-height:155px;resize:vertical;border:1px solid #dbe5df;border-radius:12px;background:#fbfdfc;padding:18px;font:18px/1.8 system-ui,sans-serif;color:#243b35;margin-top:12px}textarea:focus{outline:2px solid #a4d5bf;outline-offset:2px}.hint{font-size:13px;margin:12px 0 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat{background:#fff;border:1px solid #e0e8e4;border-radius:14px;padding:18px}.value{font-size:27px;font-weight:650;font-variant-numeric:tabular-nums}.name{font-size:12px;color:#71837d;margin-top:6px}footer{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:#71837d}button{border:0;border-radius:9px;background:#26785e;color:white;padding:11px 18px;cursor:pointer}button:hover{background:#1b614a}@media(max-width:550px){.card{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}#reference{font-size:18px}h1{font-size:27px}}
[hidden]{display:none!important}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.lesson{text-align:left;background:white;color:#243b35;border:1px solid #e0e8e4;border-radius:16px;padding:24px;transition:transform .15s,border-color .15s}.lesson:hover{background:#fafffc;border-color:#63aa8d;transform:translateY(-3px)}.lesson h2{font-size:20px;margin:14px 0 10px}.lesson p{font-size:14px;margin:0 0 18px}.badge{font-size:12px;color:#26785e;background:#eaf5ee;padding:5px 9px;border-radius:6px}.lesson small{color:#71837d}.back{background:transparent;color:#26785e;padding:0;margin-bottom:20px}.back:hover{background:transparent;text-decoration:underline}button:focus-visible{outline:3px solid #80bea4;outline-offset:4px}
</style>
</head>
<body>
<main>
<header><div class="tag">TYPE · FOCUS · FLOW</div><h1>轻敲，找到你的节奏。</h1><p>专注眼前的文字，让每一次敲击都更从容。</p></header>
<section id="selection" aria-label="选择练习文章"><p>选择一篇文章，开始今天的练习。难度越高，篇幅和标点变化越多。</p><div id="choices" class="choices"></div></section>
<div id="practice" hidden>
<button id="back" class="back" type="button">← 返回选择文章</button>
<p id="lesson-title"></p>
<section class="card" aria-label="打字练习">
<div class="label">参考原文</div><div id="reference"></div>
<label for="input" class="label" style="display:block;margin-top:26px;margin-bottom:0">你的输入</label>
<textarea id="input" placeholder="在这里开始输入，计时将自动开始……" spellcheck="false" autocomplete="off" autocapitalize="off" aria-describedby="hint"></textarea>
<p id="hint" class="hint">按原文顺序逐字输入，不能跳字；输错后可用退格键修正。清空即可重新开始。</p>
</section>
<section class="stats" aria-label="实时统计" ><div class="stat"><div id="speed" class="value">0</div><div class="name">字 / 分钟</div></div><div class="stat"><div id="total" class="value">0</div><div class="name">总字符数</div></div><div class="stat"><div id="errors" class="value">0</div><div class="name">错误字符数</div></div><div class="stat"><div id="accuracy" class="value">100%</div><div class="name">正确率</div></div></section>
<footer><span id="status" role="status">准备好了，就开始吧 · 00:00</span><button id="reset" type="button">重新练习 ↻</button></footer>
</div>
</main>
<script src="practice.js"></script>
</body>
</html>
