<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知行 · 学生信息管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#192b43;font:15px 'Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:#2364df;color:white}button.secondary{background:#e9eff9;color:#31517d}aside{position:fixed;width:230px;height:100vh;background:#132842;color:#fff;padding:32px 22px}h1{font-size:23px}aside p{color:#91a6c0}nav button{display:block;width:100%;text-align:left;margin:10px 0;background:transparent;color:#b9c9df}nav button.active{background:#2b5ba1;color:white}main{margin-left:230px;padding:35px 45px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}h2{font-size:28px;margin:8px 0}small,.muted{color:#7b8da5}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:25px 0}.card,section{background:white;border:1px solid #e2e8f0;border-radius:13px;padding:24px}.card b{display:block;font-size:32px;margin-top:14px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{text-align:left;padding:16px 10px;border-bottom:1px solid #edf0f5}th{color:#7b8da5;font-size:13px}td button{padding:6px 10px;margin:2px}input,select{padding:11px;border:1px solid #d5deeb;border-radius:8px;max-width:100%;background:white}#login{max-width:420px;margin:12vh auto;padding:38px;background:white;border-radius:18px;box-shadow:0 15px 70px #142b4215}#login input{width:100%;margin:10px 0}#login button{width:100%;margin-top:15px}dialog{border:0;border-radius:16px;width:470px;padding:28px}dialog::backdrop{background:#10223d77}label{display:block;margin:14px 0}label input,label select{display:block;width:100%;margin-top:8px}.toolbar{display:flex;justify-content:space-between;gap:12px}article{padding:20px 0;border-bottom:1px solid #edf0f5}#message{color:#bf3548;min-height:22px} @media(max-width:800px){aside{position:static;width:100%;height:auto;padding:15px}nav{display:flex;overflow:auto}nav button{min-width:105px}main{margin:0;padding:20px}.cards{gap:8px}.card{padding:12px}section{overflow:auto;padding:15px}}
</style><div id="login"><small>CAMPUS INFORMATION SYSTEM</small><h1>知行 · 学生信息管理</h1><p class="muted">连接校园，让成长清晰可见。</p><form id="loginForm"><input name="username" placeholder="请输入账号 / 学号" required autocomplete="username"><input name="password" type="password" placeholder="请输入密码" required autocomplete="current-password"><button>登录系统 →</button></form><p id="message"></p><small>管理员与学生使用各自账号登录</small></div><div id="app" hidden><aside><h1>▣ 知行校园</h1><p>学生信息管理平台</p><nav id="nav"></nav><small id="role"></small></aside><main><header><div><small>WORKSPACE / 校园工作台</small><h2 id="title"></h2></div><button class="secondary" onclick="logout()">退出登录</button></header><div id="cards" class="cards"></div><section id="content"></section></main></div><dialog id="editor"><form id="editForm"><h2 id="editTitle">编辑信息</h2><div id="fields"></div><p id="formError" style="color:#bf3548"></p><button type="button" class="secondary" onclick="editor.close()">取消</button> <button>保存信息</button></form></dialog><script>
let token=sessionStorage.getItem('token'),data,view='students',editing=null;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){let r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.error);return d}
const schema={students:[['number','学号'],['name','姓名'],['major','专业'],['class_name','班级'],['phone','联系电话'],['email','邮箱']],courses:[['name','课程名称'],['teacher','授课教师'],['credits','学分']],grades:[['student_id','学生'],['course_id','课程'],['score','成绩']],notices:[['title','公告标题'],['content','公告内容']]},names={students:'学生档案',courses:'课程中心',grades:'成绩管理',notices:'校园公告',profile:'个人资料'};
$('loginForm').onsubmit=async e=>{e.preventDefault();try{let d=await api('login','POST',Object.fromEntries(new FormData(e.target)));token=d.token;sessionStorage.setItem('token',token);await load()}catch(e){$('message').textContent=e.message}};
async function load(){data=await api('data');$('login').hidden=true;$('app').hidden=false;$('role').textContent=data.role==='admin'?'管理员工作空间':'学生个人空间';if(data.role!=='admin'&&view==='students')view='profile';render()}
function render(){let admin=data.role==='admin';$('nav').innerHTML=(admin?['students','courses','grades','notices']:['profile','courses','grades','notices']).map(k=>`<button class="${view===k?'active':''}" onclick="view='${k}';render()">${names[k]}</button>`).join('');$('title').textContent=names[view];$('cards').innerHTML=[['在册学生',data.students.length],['开设课程',data.courses.length],['校园公告',data.notices.length]].map(([t,n])=>`<div class="card"><small>${t}</small><b>${n.toString().padStart(2,'0')}</b></div>`).join('');if(view==='profile'){let s=data.students[0];$('content').innerHTML=s?`<h3>${esc(s.name)} <small>${esc(s.number)}</small></h3><p>${esc(s.major)} · ${esc(s.class_name)}</p><form id="profile"><label>联系电话<input name="phone" value="${esc(s.phone)}"></label><label>邮箱<input name="email" type="email" value="${esc(s.email)}"></label><button>保存联系方式</button><span id="saved"></span></form>`:'暂无档案';if(s)$('profile').onsubmit=async e=>{e.preventDefault();try{await api('profile','POST',Object.fromEntries(new FormData(e.target)));$('saved').textContent=' 已保存'}catch(e){alert(e.message)}};return} $('content').innerHTML=`<div class="toolbar"><input id="search" placeholder="搜索${names[view]}…" oninput="rows(this.value)">${admin?'<button onclick="edit()">＋ 新增记录</button>':''}</div><div id="rows"></div>`;rows('')}
function rows(q){let items=data[view].filter(x=>Object.values(x).some(v=>String(v).includes(q))),admin=data.role==='admin';let actions=x=>admin?`<button class="secondary" onclick="edit(${x.id})">编辑</button><button class="secondary" onclick="removeRow(${x.id})">删除</button>`:'';if(view==='notices'){$('rows').innerHTML=items.map(x=>`<article><small>${esc(x.created)}</small><h3>${esc(x.title)}</h3><p style="white-space:pre-wrap">${esc(x.content)}</p>${actions(x)}</article>`).join('')||'<p class="muted">暂无公告</p>';return}let cols=view==='grades'?[['student_name','学生'],['number','学号'],['course_name','课程'],['score','成绩']]:schema[view];$('rows').innerHTML=`<table><thead><tr>${cols.map(x=>'<th>'+x[1]+'</th>').join('')}${admin?'<th>操作</th>':''}</tr></thead><tbody>${items.map(x=>`<tr>${cols.map(([k])=>'<td>'+esc(x[k])+'</td>').join('')}${admin?'<td>'+actions(x)+'</td>':''}</tr>`).join('')}</tbody></table>${items.length?'':'<p class="muted">暂无匹配记录</p>'}`}
function edit(id){editing=id;let x=data[view].find(x=>x.id===id)||{};$('formError').textContent='';$('fields').innerHTML=schema[view].map(([k,t])=>{let options=k==='student_id'?data.students:k==='course_id'?data.courses:null;return `<label>${t}${options?`<select name="${k}" required>${options.map(o=>`<option value="${o.id}" ${x[k]===o.id?'selected':''}>${esc(o.name)}${o.number?' · '+esc(o.number):''}</option>`).join('')}</select>`:`<input name="${k}" value="${esc(x[k])}" ${['phone','email'].includes(k)?'':'required'} ${['credits','score'].includes(k)?'type="number" step="0.5" min="0"':''} ${k==='score'?'max="100"':''}>`}</label>`}).join('');$('editor').showModal()}
$('editForm').onsubmit=async e=>{e.preventDefault();try{await api(view,'POST',{...Object.fromEntries(new FormData(e.target)),id:editing});$('editor').close();await load()}catch(e){$('formError').textContent=e.message}};async function removeRow(id){if(!confirm('确认删除此记录？相关成绩也可能一并删除。'))return;try{await api(view,'DELETE',{id});await load()}catch(e){alert(e.message)}}async function logout(){await api('logout','POST');sessionStorage.removeItem('token');location.reload()}if(token)load().catch(()=>{sessionStorage.removeItem('token');location.reload()});
</script></html>
