<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容管理</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">P<span>·</span></a><a href="index.html">返回作品集 ↗</a></header><main class="admin"><p class="eyebrow">CONTENT STUDIO</p><h1>让作品集保持更新。</h1><p>本地管理工具：数据仅保存在当前浏览器，无账号鉴权。请导出备份；公开站点更新需将内容纳入代码后重新部署。</p><form id="editor"><div class="form-grid"><label>姓名<input name="name" required maxlength="60"></label><label>职业标题<input name="title" required maxlength="100"></label><label>邮箱<input name="email" type="email" required></label><label>所在地<input name="location" maxlength="100"></label></div><label>个人简介<textarea name="bio" required></textarea></label><label>关于我<textarea name="about"></textarea></label><label>技能（每行一项）<textarea name="skills"></textarea></label><label>项目（JSON 数组，每项包含 title、description、tags、url）<textarea name="projects" rows="10" spellcheck="false" required></textarea></label><div class="form-grid"><label>头像（PNG/JPEG/WebP，最大 1MB）<input id="avatarUpload" type="file" accept="image/png,image/jpeg,image/webp"></label><label>简历（PDF，最大 2MB）<input id="resumeUpload" type="file" accept="application/pdf"></label></div><div class="actions"><button type="submit">保存修改</button><button id="clearAvatar" type="button">移除头像</button><button id="clearResume" type="button">移除简历</button><button id="export" type="button">导出备份</button><label class="import">导入备份<input id="import" type="file" accept="application/json"></label></div><p id="status" role="status" aria-live="polite"></p></form></main><script src="app.js"></script></body></html>
